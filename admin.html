<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | Finology</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.ad{max-width:820px;padding-bottom:80px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:600 13px Montserrat,sans-serif;cursor:pointer}
.tabs .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alert{background:var(--bg2);border:1px solid var(--flame);border-radius:12px;padding:12px 16px;font-size:14px;margin-top:22px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.item{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.item small{display:block;color:var(--mute);margin-top:2px}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.acts button:last-child:hover{color:var(--rose);border-color:var(--rose)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:14px}
input,textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.hint{color:var(--mute);font-size:14px;margin:10px 0 20px}
dialog{border:1px solid var(--line);border-radius:18px;padding:26px;width:min(480px,92vw);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin-bottom:16px}
.drow{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:600px){.item{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header><div class="wrap bar"><span class="brand">FINOLOGY&nbsp;ADMIN</span><a class="btn ghost sm" href="index.html">View site</a></div></header>
<main class="wrap ad"><div id="banner"></div><div class="tabs" id="tabs"></div><section id="panel"></section></main>
<dialog id="dlg"><form id="f"><h3 id="dt"></h3><div id="fields"></div><div class="drow"><button type="button" class="btn ghost sm" id="cancel">Cancel</button><button class="btn sm">Save</button></div></form></dialog>
<script src="data.js"></script>
<script>
const KEY="finology_draft",GK="finology_gh",$=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
let live=clone(window.SITE),draft=null,tab="settings",ed=null;
try{draft=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!draft||!draft.settings)draft=clone(live);
const TABS=[["settings","Site settings"],["services","Services"],["exclusive","Exclusive content"],["help","Help"],["notes","Notes"],["publish","Publish"]];
const SET=[["heroTitle","Home headline"],["heroText","Home intro","t"],["servicesIntro","Services intro","t"],["exclusiveIntro","Exclusive content intro","t"],["helpIntro","Help intro","t"],["notesIntro","Notes intro","t"],["contactTitle","Contact heading"],["contactText","Contact text","t"],["countryCode","Country code, digits only (91 for India)"],["phone","Phone number (used for WhatsApp and Telegram)"],["telegramUser","Telegram username (optional, replaces the phone link)"],["email","Email address"],["footerNote","Footer disclaimer","t"]];
const S={
  services:[["title","Service name"],["desc","Description","t"],["price","Label, e.g. Beginner or a price (optional)"]],
  exclusive:[["title","Title"],["desc","Description","t"],["tag","Label, e.g. Video or PDF"],["link","Link (optional, starts with https://)"]],
  help:[["q","Question"],["a","Answer","t"]],
  notes:[["title","Title"],["desc","Note","t"],["tag","Tag (optional)"],["date","Date"]]
};
const NAME={services:"service",exclusive:"exclusive content",help:"question",notes:"note"};
const fld=(n,l,t,v)=>`<label>${l}${t?`<textarea name="${n}" rows="3">${esc(v)}</textarea>`:`<input name="${n}" value="${esc(v)}">`}</label>`;
const dirty=()=>JSON.stringify(draft)!==JSON.stringify(live);
const flag=()=>{$("#banner").innerHTML=dirty()?'<div class="alert">You have changes that are not live yet. Open the Publish tab to put them on your site.</div>':""};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(draft))}catch(e){}flag()};
const toJS=()=>"/* All site content lives here. The admin panel (admin.html) rewrites this file for you. */\nwindow.SITE = "+JSON.stringify(draft,null,2)+";\n";
const st=(m,bad)=>{const e=$("#st");e.textContent=m;e.style.color=bad?"var(--rose)":""};

function show(t){
  if(t)tab=t;
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" data-t="${k}">${l}</button>`).join("");
  const p=$("#panel");
  if(tab==="settings")p.innerHTML=SET.map(([n,l,t])=>fld(n,l,t,draft.settings[n])).join("");
  else if(tab==="publish"){
    let g={};try{g=JSON.parse(localStorage.getItem(GK))||{}}catch(e){}
    p.innerHTML=`<div class="ph"><h2>Publish</h2></div><p class="hint">Publishing saves your changes to data.js in your GitHub repo. GitHub Pages then updates the live site in about a minute. You need a GitHub token once: GitHub &rsaquo; Settings &rsaquo; Developer settings &rsaquo; Fine-grained tokens, limited to this repo with Contents set to Read and write. It stays in this browser only.</p>
<label>Repository (owner/name)<input id="gr" value="${esc(g.repo)}" placeholder="yourname/finology"></label>
<label>Branch<input id="gb" value="${esc(g.branch||"main")}"></label>
<label>Token<input id="gt" type="password" value="${esc(g.token)}" autocomplete="off"></label>
<div class="cta"><button class="btn hot" id="pub">Publish to GitHub</button><button class="btn ghost" id="dl">Download data.js</button><button class="btn ghost" id="disc">Discard draft</button></div><p id="st" class="hint"></p>`;
  }else{
    const L=draft[tab];
    p.innerHTML=`<div class="ph"><h2>${TABS.find(x=>x[0]===tab)[1]}</h2><button class="btn sm" data-add>+ Add ${NAME[tab]}</button></div>`+(L.map((d,i)=>`<div class="item"><div><b>${esc(d.title||d.q)}</b><small>${esc((d.desc||d.a||"").slice(0,90))}</small></div><div class="acts"><button data-a="up" data-i="${i}" aria-label="Move up">&uarr;</button><button data-a="dn" data-i="${i}" aria-label="Move down">&darr;</button><button data-a="ed" data-i="${i}">Edit</button><button data-a="del" data-i="${i}">Delete</button></div></div>`).join("")||'<p class="empty">Nothing here yet. Add your first item.</p>');
  }
  flag();
}
function form(k,i){
  ed={k,i};const d=i>=0?draft[k][i]:{};
  if(i<0&&k==="notes")d.date=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  $("#dt").textContent=(i>=0?"Edit ":"Add ")+NAME[k];
  $("#fields").innerHTML=S[k].map(([n,l,t])=>fld(n,l,t,d[n])).join("");
  $("#fields").querySelector("input,textarea").required=true;
  $("#dlg").showModal();
}
$("#f").onsubmit=e=>{
  e.preventDefault();
  const o=Object.fromEntries(new FormData(e.target)),{k,i}=ed;
  if(i>=0)draft[k][i]=o;else draft[k][k==="notes"?"unshift":"push"](o);
  save();$("#dlg").close();show();
};
$("#cancel").onclick=()=>$("#dlg").close();
$("#panel").addEventListener("input",e=>{if(tab==="settings"&&e.target.name){draft.settings[e.target.name]=e.target.value;save()}});

async function publish(){
  const g={repo:$("#gr").value.trim(),branch:$("#gb").value.trim()||"main",token:$("#gt").value.trim()};
  if(!g.repo||!g.token)return st("Enter the repository and token first.",true);
  try{localStorage.setItem(GK,JSON.stringify(g))}catch(e){}
  st("Publishing...");
  try{
    const api="https://api.github.com/repos/"+g.repo+"/contents/data.js",h={Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json"};
    let sha;const r0=await fetch(api+"?ref="+encodeURIComponent(g.branch),{headers:h});
    if(r0.ok)sha=(await r0.json()).sha;
    else if(r0.status!==404)throw new Error("GitHub returned "+r0.status+" while reading data.js. Check the repository name, branch and token.");
    const r=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:"Update site content from admin panel",content:btoa(unescape(encodeURIComponent(toJS()))),branch:g.branch,sha})});
    if(!r.ok)throw new Error("GitHub returned "+r.status+" while saving. Check that the token has Contents: Read and write for this repository.");
    live=clone(draft);flag();st("Published. The live site updates in about a minute.");
  }catch(e){st(e.message,true)}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t)return show(b.dataset.t);
  if("add" in b.dataset)return form(tab,-1);
  if(b.id==="pub")return publish();
  if(b.id==="dl"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([toJS()],{type:"text/javascript"}));a.download="data.js";a.click();return}
  if(b.id==="disc"){if(confirm("Discard all changes made here and go back to the live content?")){try{localStorage.removeItem(KEY)}catch(x){}draft=clone(live);show()}return}
  const a=b.dataset.a,i=+b.dataset.i,L=draft[tab];
  if(a==="del"){if(confirm("Delete this item?")){L.splice(i,1);save();show()}}
  else if(a==="ed")form(tab,i);
  else if((a==="up"&&i>0)||(a==="dn"&&i<L.length-1)){const j=a==="up"?i-1:i+1;[L[i],L[j]]=[L[j],L[i]];save();show()}
});
show();
</script>
</body>
</html>
